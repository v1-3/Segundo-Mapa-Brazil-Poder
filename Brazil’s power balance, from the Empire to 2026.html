"],["PTDOB","PTDOB"]],[["PSD","PSD"],["PRONA","PRONA"],["PV","PV"],["PSL","PSL"],["PTDOB","PTDOB"],["PJ","PJ"],["PSTU","PSTU"],["AVANTE","AVANTE"]],[["PRONA","PRONA"],["PTDOB","PTDOB"],["PTC","PTC"],["PAN","PAN"],["PSDC","PSDC"],["PEN","PEN"],["PSL","PSL"],["PRTB","PRTB"],["PMR","PMR"],["REDE","REDE"],["PMB","PMB"],["AVANTE","AVANTE"]],[["AVANTE","AVANTE"],["PATRIOTA","PATRIOTA"],["PV","PV"],["REDE","REDE"],["PTDOB","PTDOB"],["PMB","PMB"],["PEN","PEN"],["PATRI","PATRI"],["PMN","PMN"],["PPL","PPL"],["PRTB","PRTB"],["PTC","PTC"],["DC","DC"]],[["PV","PV"],["PRD","PRD"],["REDE","REDE"],["PATRIOTA","PATRIOTA"],["CIDADANIA","CIDADANIA"],["PSC","PSC"],["MISSÃO","MISSÃO"],["DC","DC"],["PROS","PROS"]]],"epre":[[1822,"Independence","Independência"],[1824,"The Constitution","A Constituição"],[1831,"Pedro I abdicates","Pedro I abdica"],[1850,"The slave trade ends","Fim do tráfico de escravos"],[1871,"Law of the Free Womb","Lei do Ventre Livre"],[1888,"Golden Law","Lei Áurea"],[1889,"The Republic is proclaimed","Proclamação da República"],[1891,"Republican Constitution","Constituição republicana"],[1922,"PCB founded; Modern Art Week","Fundação do PCB; Semana de Arte Moderna"],[1930,"The 1930 revolution","A Revolução de 1930"],[1932,"Women’s vote; São Paulo revolt","Voto feminino; revolta paulista"],[1934,"New Constitution","Nova Constituição"],[1937,"Estado Novo coup","Golpe do Estado Novo"],[1945,"Vargas is deposed","Vargas é deposto"]]},K={"en":{"P":[{"a":1822,"b":1889,"u":1,"ic":8,"t":"The Empire","lead":"A constitutional monarchy where the Emperor, not the parties, held the final say.","power":"Under the 1824 Constitution the Emperor held the Moderating Power: he could dissolve the Chamber, name the prime minister and choose senators for life from lists. Conservatives and Liberals took turns in cabinets, but they governed at the Emperor’s pleasure, and the vote was limited by income. No party index is possible: parties were loose groupings, not the source of power.","gov":"Pedro I (1822–31) abdicated; regents ruled until Pedro II took the throne in 1840 and reigned until 1889. From 1847 a prime minister headed the cabinet, chosen by the Emperor, who alternated Conservative and Liberal governments.","ev":"1822: independence. 1824: the Constitution. 1850: the slave trade ends. 1871: the Law of the Free Womb. 1888: the Golden Law abolishes slavery. 15 November 1889: the army proclaims the Republic.","id":"Liberalism against conservatism, the abolitionist campaign, a growing republican movement (manifesto of 1870) and positivism among army officers.","extra":"Conservative and Liberal parties; the Republican Party from 1870"},{"a":1889,"b":1930,"u":1,"ic":5,"t":"The Old Republic","lead":"A federal republic run by state oligarchies, with elections few could truly contest.","power":"The 1891 Constitution made Brazil a federal presidential republic. Real power sat in the state machines, above all São Paulo’s PRP and Minas Gerais’s PRM, whose bosses traded the presidency (the “coffee with milk” pattern) and kept local loyalty through “colonels”. Under Campos Sales (1898–1902) the “politics of the governors” tied each state’s support to the federal government’s. Voting was open, not secret, and only a few percent of Brazilians voted.","gov":"Military presidents Deodoro and Floriano (1889–94) gave way to civilians from Prudente de Morais (PRP) on. The presidency stayed in the hands of the São Paulo and Minas machines and their allies until 1930.","ev":"1893–95: the Federalist Revolution. 1897: Canudos. 1904: the Vaccine Revolt. 1922: the Modern Art Week, the Copacabana revolt of young officers, and the founding of the PCB. 1930: after a disputed election the army and Getúlio Vargas take power.","id":"Positivism and oligarchic liberalism in government; the labour and anarchist movements in the cities; modernism in the arts; and the officers’ “tenentismo”, which demanded honest elections and reform.","extra":"State parties such as the PRP, PRM and PRR; the PCB from 1922"},{"a":1930,"b":1945,"u":1,"ic":2,"t":"The Vargas era","lead":"Revolution, a short constitutional spell and then the Estado Novo dictatorship.","power":"Getúlio Vargas ruled first by decree (1930–34), then under the 1934 Constitution, and from the coup of November 1937 as a dictator with Congress closed and every party banned. Power rested on the president, the army and a state-run labour system, not on parties; the index would measure almost nothing.","gov":"1930: Vargas takes power after the revolution. 1934: a new Constitution. 1937: the Estado Novo. 1945: the army removes him as the war ends and a transition to elections begins, with new parties (PSD, UDN, PTB, PCB) founded that year.","ev":"1932: the Electoral Code creates the secret ballot and women’s vote, and the Constitutionalist Revolution erupts in São Paulo. 1935: a communist uprising. 1943: the labour code (CLT). 1944: Brazilian troops fight in Italy. October 1945: Vargas is deposed.","id":"Corporatism and authoritarian nationalism, the clash between fascist-inspired integralism and the left, state-led industrialisation, and “trabalhismo”, the labour-friendly populism that Vargas’s heirs would inherit.","extra":"AIB (integralists) and ANL until banned; all parties abolished in 1937"},{"a":1947,"b":1954,"t":"The Dutra–Vargas republic","ic":0,"lead":"Brazil’s first competitive multiparty republic, under the 1946 Constitution.","power":"The PSD held the presidency (Dutra), the Chamber speakership and, through Vice President Nereu Ramos, the Senate chair, plus most governorships. That stacking of offices is why the index puts it far ahead. The UDN was the main opposition; the PTB grew once Vargas returned in 1950.","gov":"Dutra (PSD) governed 1946–51 with the PSD in the lead; the UDN mostly opposed him but joined the 1948 interparty agreement with the PSD and PR. Vargas won the 1950 election for the PTB and ruled with PSD and PSP support until his suicide in August 1954, when Vice President Café Filho (PSP) took over.","ev":"1947: the Communist Party (PCB) was banned and its elected members lost their seats. 1953: Petrobras created after the “the oil is ours” campaign. 1954: the political crisis around Vargas ends in his death.","id":"Anti-communism of the early Cold War against nationalist, labour-friendly populism (trabalhismo). Women had voted since 1932, but few held office. Left parties were pushed to the margins by the 1947 ban.","extra":"PCB (banned from 1947)"},{"a":1955,"b":1964,"t":"Developmentalism and crisis","ic":1,"lead":"Growth, Brasília, and a slide towards the 1964 coup.","power":"The PSD still led, but the PTB climbed: João Goulart (PTB) was vice president and so chaired the Senate from 1956. Ranieri Mazzilli (PSD) led the Chamber from 1958 to 1965 and twice filled the presidency for a few days, a clear case of how a house presidency can matter.","gov":"Kubitschek (PSD, with the PTB’s Goulart as vice president) governed from 1956 to 1961. Jânio Quadros resigned in August 1961; the military resisted Goulart’s succession and Congress adopted a parliamentary system until a 1963 plebiscite restored presidentialism.","ev":"1960: Brasília inaugurated. 1961: Jânio’s resignation. 1962–63: land-reform and union mobilisation. 31 March 1964: a military coup removes Goulart.","id":"Developmentalist optimism, then polarisation: a mobilised left (unions, peasant leagues, inspired in part by the Cuban Revolution) against a conservative backlash of business, Church and military sectors.","extra":"PSP, PDC, PRP (small parties)"},{"a":1965,"b":1979,"t":"The two-party dictatorship","ic":2,"lead":"Parties were abolished in 1965; only ARENA and the MDB were allowed.","power":"ARENA held the presidency, both house presidencies and, until 1982, every governorship except Guanabara’s (the MDB’s Chagas Freitas, 1971–75), so the index gives it roughly 77–85% of the total. The MDB’s weight came from deputies and, after 1974, from senators, but it could not turn that into office.","gov":"Castelo Branco (1964–67), Costa e Silva (1967–69, then a junta), Médici, Geisel and Figueiredo, all army generals chosen by the military and ratified by an indirect vote in Congress. Governors were also chosen indirectly.","ev":"1965: Institutional Act 2 ends the old parties. 1968: Act 5 closes Congress and cancels rights. 1968–73: the “economic miracle”. 1974: the MDB’s Senate surge. 1979: the Amnesty Law and party reform.","id":"National security doctrine and anti-communism in power; an armed and student left suppressed; the Church’s liberation theology and a new feminist movement (the 1975 UN women’s year) grow in the opposition space.","extra":"PCB and PCdoB (clandestine), no legal third party"},{"a":1980,"b":1989,"t":"Opening and re-democratisation","ic":3,"lead":"The return of elections, a new party system and a new constitution.","power":"ARENA’s heir, the PDS, led until 1985. Then the PMDB took the presidency (Sarney), the Chamber (Ulysses Guimarães), the Senate, and 22 of the 23 governorships chosen in 1986. This is the most concentrated power in the data after the dictatorship.","gov":"1982: direct governor elections return. 1984: the “Diretas Já” campaign fails in Congress. Jan 1985: Tancredo Neves is chosen by an electoral college but falls ill; Sarney assumes the presidency on 15 March and keeps it after Tancredo dies on 21 April. 1989: the first direct presidential vote since 1960.","ev":"1980: the PT is founded. 1986: the Cruzado Plan. 1987–88: the Constituent Assembly writes the 1988 Constitution. High inflation throughout.","id":"Mass democratic mobilisation, new unionism and the birth of the PT; the women’s and Black movements enter the Constituent Assembly; the party system splits into the PMDB, PFL, PDT, PT and others.","extra":"PCB and PCdoB (legal again from 1985), PSB, PV, many new small parties"},{"a":1990,"b":2002,"t":"Markets, stability and the PSDB","ic":4,"lead":"Hyperinflation ends and a PSDB–PFL alliance governs.","power":"The PMDB faded after 1990. The PSDB took the presidency in 1995 with Fernando Henrique Cardoso and governed with the PFL, which held the Chamber (1993–97) and Senate (1997–2001) chairs at different times: an ally can hold more offices than the president’s own party.","gov":"Collor (PRN) governed from 1990 and resigned in December 1992 amid impeachment proceedings; Itamar Franco (no party during his term; he returned to the PMDB in 1997) governed from 1992 to 1994; Cardoso (PSDB) governed from 1995 to 2003, with a 1997 amendment allowing re-election.","ev":"1990: the Collor Plan freezes savings. 1992: impeachment. 1994: the Real Plan ends hyperinflation. 1997–98: major privatisations (Vale, telecoms).","id":"Neoliberal and “third way” currents; privatisation and fiscal discipline; the PT grows as the main opposition; evangelical churches start to organise politically.","extra":"PRN, PDC, PTR, PRONA and others with a few seats"},{"a":2003,"b":2015,"t":"The PT era","ic":5,"lead":"Lula and Dilma, with the PMDB as indispensable partner.","power":"The PT held the presidency throughout and the Chamber presidency at times (João Paulo 2003–05, Chinaglia 2007–09, Marco Maia 2011–13). The MDB held the Senate chair almost continuously and the Chamber chair in 2009–11 and 2013–16, so the two parties are the poles of the index.","gov":"Lula (2003–10) built wide coalitions around the PT, PMDB, PP, PR and PSB; Dilma Rousseff (2011–16) lost cohesion after the 2013 protests and her 2014 narrow re-election.","ev":"2003: Bolsa Família. 2005: the “mensalão” vote-buying scandal. 2008: the global crisis. 2013: the June protests. 2014: Operation Car Wash begins.","id":"The Latin American “red wave” or pink tide: social programmes, minimum-wage rises and poverty reduction. The Maria da Penha Law (2006) marks a feminist advance; a fourth feminist wave and a conservative reaction both build.","extra":"PSOL (from 2005), PV, PCdoB, PPS in small blocs"},{"a":2016,"b":2022,"t":"Impeachment, anti-politics and fragmentation","ic":6,"lead":"A president removed, a new right, and a scattered Congress.","power":"In 2016 the MDB spiked: Michel Temer held the presidency while the MDB also held the Senate chair and, until July, the Chamber chair. After 2018 the index spreads out: PSL and then PL held the presidency while the DEM, PP and PSD held the house chairs.","gov":"Dilma was impeached in August 2016; Temer (MDB) served to 2018; Jair Bolsonaro (PSL, later no party and then PL) won in 2018; Lula won the 2022 runoff by a narrow margin.","ev":"2016: impeachment. 2017–18: Lula convicted and barred from running; his convictions were annulled by the Supreme Court in 2021. 2018: the “Ele Não” women’s protests. 2020: the Covid-19 pandemic. 2021: the Chamber’s “centrão” gains control of the budget.","id":"A right-wing populist and anti-corruption wave and strong evangelical conservatism. The centrão is an informal bloc of mid-sized, mostly centre-right parties (PP, PL, Republicanos, União and others) that trade legislative support for posts and budget access. Feminist and Black movements mobilise against it; the PT is weakened, then recovers.","extra":"Novo, Rede, Solidariedade, Podemos and a dozen others with few seats"},{"a":2023,"b":2026,"t":"Lula again, power shared","ic":7,"lead":"A president from the left, with the centre and right running both houses.","power":"The PT regained the presidency but not the house chairs: the PP (Arthur Lira) and then Republicanos (Hugo Motta) lead the Chamber, the PSD (Pacheco) and then União (Alcolumbre) the Senate. The index spreads power across PT, União, Republicanos, PL and PSD.","gov":"Lula’s third term began on 1 January 2023, with a broad coalition including MDB, PSD, União and PSB. Party federations (PT–PCdoB–PV, PSOL–Rede, PSDB–Cidadania) started in 2022.","ev":"8 January 2023: attacks on the Praça dos Três Poderes. 2023: new fiscal framework; tax reform. 2026: general elections under way as of this writing.","id":"Open polarisation between the left and the bolsonarist right, with a pragmatic centrão in between; identity politics, gender and religion remain central in campaigns.","extra":"PSTU, PCO, UP and the current PCB (registered, no federal seats); Novo, Rede, PMB, DC, Agir with few"}],"M":[["What it measures","The Party Political Power Index (PPI) scores each party line each year on the offices it holds: president, Chamber speaker, Senate president, share of governorships, share of Senate seats and share of Chamber seats. It covers executive and legislative power, not Congress alone. Scores are model points out of about 100, not a share of real influence."],["The formula","Index = 15 × president (0 or 1) + 8 × speaker + 7 × Senate president + 20 × share of governorships + 14 × share of Senate seats + 36 × share of Chamber seats. The weights sum to 100. A coalition’s uncertainty must be computed jointly, so adding party medians is only an approximation."],["Snapshot and timing","Every year is a snapshot on 1 July: office holders and seats as of that date. Changes inside a year are not shown, for example 1954, 1961, 1985, 1992, 2005 and 2016. The 2005 Chamber chair is PP’s Severino Cavalcanti on 1 July; Aldo Rebelo (PCdoB) took over in September. 2026 is year to date."],["Why these weights","They are a judgement, not a result. Roll-call data shows the president’s party delivers about a fifth to a quarter of the government’s votes, so the presidency is not weighted far above seats. Other weights are plausible; the uncertainty below shows how much that matters."],["Uncertainty, exactly","5,000 draws with seed 11. Each weight is multiplied by a lognormal factor (sigma 0.5) and rescaled to 100. Seats get independent normal noise: Chamber sd 3 of 513; governors sd 1.5 of 27 and senators sd 3 of 81 where election data exists, sd 3 and 6 where estimated. Bands are medians, so they can total more or less than 100."],["Seats, sources and parties","Chamber seats are shares: from 2001 the average number of each party’s deputies voting in that year’s roll calls (which follows party switches), and before that each legislature’s party lists (which include substitutes). From 1995 governors come from TSE results, cross-checked against Wikipedia (96% agreement), and senators from the Senate’s dated affiliation records, cross-checked against TSE. In 1947–1994 governors come from state election tables (the 1955, 1960 and 1965 elections are missing; 1966–82 is fixed to the governing party) and senators are estimated from Chamber shares (lighter strands). A party line can only score in years it legally existed. Parties under 1 point are listed off to the side."],["How power works in Congress","The index uses formal offices only. Real influence also runs through committee chairs, the speaker’s control of the agenda, party leaders, budget amendments and voting thresholds: 257 of 513 deputies for a majority, and 308 deputies plus 49 senators for a constitutional amendment."],["Worked example","__EX__"]],"V":[{"a":1947,"b":1963,"ic":0,"s":"Populist Republic","t":"The Populist Republic","lead":"Competitive multiparty politics under the 1946 Constitution, from Dutra to Goulart, ended by the 1964 coup.","power":"The PSD held the presidency under Dutra (1946–51) and Kubitschek (1956–61), plus most governorships and the Senate chair through its vice presidents. The PTB rose with Vargas and Goulart, whose vice presidency (1956–61) gave the party the Senate chair. The UDN, the main opposition, lost every presidential race until Jânio Quadros in 1960. Ranieri Mazzilli (PSD) led the Chamber from 1958 and twice filled the presidency briefly.","gov":"Dutra (PSD), Vargas (PTB, 1951–54), Café Filho (PSP), a short interim by Luz and Nereu Ramos, Kubitschek (PSD), Jânio Quadros (1961), then Goulart (PTB) under a parliamentary system from 1961 to the 1963 plebiscite, which restored presidentialism.","ev":"1947: the PCB is banned. 1950: Vargas wins. 1953: Petrobras. 1954: Vargas’s suicide. 1955: the army guarantees Kubitschek’s inauguration. 1960: Brasília opens. 1961: Jânio resigns. 1963: the plebiscite restores presidentialism.","id":"Nationalist, labour-friendly “trabalhismo” and developmentalism against liberal anticommunism, in the shadow of the Cold War and the Cuban Revolution; peasant leagues and unions mobilise while business, the Church and the military organise a conservative reaction.","extra":"PCB (banned), PSP, PDC, PRP, PTN and other small parties"},{"a":1964,"b":1984,"ic":2,"s":"Military Regime","t":"The Military Regime","lead":"Two permitted parties, generals as presidents and no real alternation in office.","power":"From 1966 only ARENA and the MDB were allowed. ARENA, and later its heir the PDS, held the presidency, both house chairs and every governorship except Guanabara’s (the MDB, 1971–75), so the index gives it roughly 77–85% of the total. The MDB’s weight came from deputies and, after 1974, senators, but never from offices.","gov":"Castelo Branco (1964–67), Costa e Silva (1967–69), a junta, Médici, Geisel and Figueiredo, all army generals chosen by the military and ratified indirectly by Congress. Governors were chosen indirectly until direct elections returned in 1982.","ev":"1964: coup. 1965: AI-2 ends the old parties. 1968: AI-5 closes Congress. 1974: the MDB surges in the Senate. 1977: the April Package closes Congress and creates indirectly chosen senators. 1979: amnesty and party reform. 1980: the PT is founded. 1983–84: the Diretas Já campaign.","id":"National security doctrine and anticommunism in power; an armed and student left repressed; the “economic miracle” of 1968–73; then the Church’s liberation theology, new unionism and a new feminist movement open space for opposition.","extra":"PCB and PCdoB (clandestine); no legal third party until 1980"},{"a":1985,"b":2002,"ic":3,"s":"Redemocratization","t":"Redemocratization and Stabilization","lead":"From Sarney’s transition to Cardoso’s second term: a new Constitution, hyperinflation and the Real Plan.","power":"In 1985 the PMDB took the presidency (Sarney), the Chamber (Ulysses Guimarães), the Senate and 22 of the 23 governorships chosen in 1986, the biggest concentration of power in the data after the dictatorship. It faded after 1990. The PSDB held the presidency from 1995 and governed with the PFL, which chaired the Chamber (1993–97) and the Senate (1997–2001).","gov":"Sarney (1985–90, after Tancredo Neves died before taking office), Collor (PRN, 1990–92, resigned amid impeachment), Itamar Franco (no party, 1992–94) and Cardoso (PSDB, 1995–2002), whose 1997 amendment allowed re-election.","ev":"1986: the Cruzado Plan. 1988: the Constitution. 1989: the first direct presidential vote since 1960. 1990: the Collor Plan. 1992: Collor resigns. 1994: the Real Plan. 1997–98: privatisations.","id":"Democratic mobilisation and the social rights of the 1988 Constitution, then a neoliberal and “third way” turn: privatisation and fiscal discipline. The PT grows as the main opposition and evangelical churches start to organise politically.","extra":"PRN, PDC, PTR, PRONA and others with a few seats"},{"a":2003,"b":2026,"ic":6,"s":"Polarization","t":"Coalition Presidentialism and Polarization","lead":"From Lula’s first term to today: the PT, an impeachment, a new right and a fragmented Congress.","power":"The PT held the presidency from 2003 to 2016 and the Chamber chair at times; the MDB held the Senate chair almost continuously, so the two parties were the poles of the index. In 2016 the MDB spiked under Temer. After 2018 power spread out: PSL and PL in the presidency, DEM, PP, PSD, União and Republicanos in the chairs of the houses.","gov":"Lula (2003–10), Dilma Rousseff (2011–16, impeached), Michel Temer (2016–18), Jair Bolsonaro (2019–22) and Lula again from 2023, each ruling through wide, shifting coalitions.","ev":"2003: Bolsa Família. 2005: the “mensalão” scandal. 2013: the June protests. 2014: Operation Car Wash. 2016: impeachment. 2018: Bolsonaro wins. 2020: Covid-19. 2022: Lula wins the runoff. 2023: the 8 January attacks.","id":"The Latin American “pink tide” and social programmes, a feminist advance (the Maria da Penha Law, 2006, and the 2018 “Ele Não” protests), strong evangelical conservatism and a right-wing populist and anti-corruption wave. The centrão, an informal bloc of mid-sized, mostly centre-right parties, trades legislative support for posts and budget access.","extra":"PSOL, Rede, Novo, Solidariedade, Podemos and others with few seats; PSTU, PCO, UP and the PCB (registered, no federal seats)"}]},"pt":{"P":[{"t":"O Império","lead":"Uma monarquia constitucional em que o Imperador, e não os partidos, tinha a palavra final.","power":"Pela Constituição de 1824, o Imperador exercia o Poder Moderador: podia dissolver a Câmara, nomear o presidente do Conselho e escolher senadores vitalícios a partir de listas. Conservadores e Liberais se alternavam nos gabinetes, mas governavam ao gosto do Imperador, e o voto dependia de renda. Não há índice partidário possível: os partidos eram agrupamentos frouxos, não a fonte do poder.","gov":"Pedro I (1822–31) abdicou; regentes governaram até Pedro II assumir o trono em 1840 e reinar até 1889. A partir de 1847 um presidente do Conselho chefiava o gabinete, escolhido pelo Imperador, que alternava governos conservadores e liberais.","ev":"1822: Independência. 1824: a Constituição. 1850: fim do tráfico de escravos. 1871: Lei do Ventre Livre. 1888: a Lei Áurea abole a escravidão. 15 de novembro de 1889: o Exército proclama a República.","id":"Liberalismo contra conservadorismo, a campanha abolicionista, um movimento republicano crescente (manifesto de 1870) e o positivismo entre oficiais do Exército.","extra":"Partidos Conservador e Liberal; Partido Republicano desde 1870","a":1822,"b":1889,"u":1,"ic":8},{"t":"A República Velha","lead":"Uma república federal comandada por oligarquias estaduais, com eleições que poucos podiam disputar de verdade.","power":"A Constituição de 1891 fez do Brasil uma república federal presidencialista. O poder real estava nas máquinas estaduais, sobretudo o PRP paulista e o PRM mineiro, cujos chefes se revezavam na Presidência (o padrão do “café com leite”) e mantinham a lealdade local por meio dos “coronéis”. Com Campos Sales (1898–1902), a “política dos governadores” ligou o apoio de cada estado ao do governo federal. O voto era aberto, não secreto, e só alguns por cento dos brasileiros votavam.","gov":"Os presidentes militares Deodoro e Floriano (1889–94) deram lugar a civis a partir de Prudente de Morais (PRP). A Presidência ficou com as máquinas de São Paulo e Minas e seus aliados até 1930.","ev":"1893–95: Revolução Federalista. 1897: Canudos. 1904: Revolta da Vacina. 1922: Semana de Arte Moderna, revolta dos oficiais do Forte de Copacabana e fundação do PCB. 1930: após uma eleição contestada, o Exército e Getúlio Vargas assumem o poder.","id":"Positivismo e liberalismo oligárquico no governo; movimentos operário e anarquista nas cidades; modernismo nas artes; e o “tenentismo” dos oficiais, que exigia eleições honestas e reformas.","extra":"Partidos estaduais como PRP, PRM e PRR; o PCB desde 1922","a":1889,"b":1930,"u":1,"ic":5},{"t":"A Era Vargas","lead":"Revolução, um breve período constitucional e depois a ditadura do Estado Novo.","power":"Getúlio Vargas governou primeiro por decreto (1930–34), depois sob a Constituição de 1934 e, a partir do golpe de novembro de 1937, como ditador, com o Congresso fechado e todos os partidos proibidos. O poder se apoiava no presidente, no Exército e num sistema trabalhista estatal, não nos partidos; o índice mediria quase nada.","gov":"1930: Vargas assume depois da revolução. 1934: nova Constituição. 1937: o Estado Novo. 1945: o Exército o depõe com o fim da guerra e começa a transição para eleições, com a fundação de novos partidos (PSD, UDN, PTB, PCB) nesse ano.","ev":"1932: o Código Eleitoral cria o voto secreto e o voto feminino, e eclode a Revolução Constitucionalista em São Paulo. 1935: levante comunista. 1943: a CLT. 1944: tropas brasileiras lutam na Itália. Outubro de 1945: Vargas é deposto.","id":"Corporativismo e nacionalismo autoritário, o choque entre o integralismo de inspiração fascista e a esquerda, industrialização conduzida pelo Estado e o “trabalhismo”, o populismo favorável aos trabalhadores que os herdeiros de Vargas assumiriam.","extra":"AIB (integralistas) e ANL até serem proibidas; todos os partidos extintos em 1937","a":1930,"b":1945,"u":1,"ic":2},{"t":"A república Dutra–Vargas","lead":"A primeira república multipartidária e competitiva do Brasil, sob a Constituição de 1946.","power":"O PSD tinha a Presidência (Dutra), a Presidência da Câmara e, pelo vice-presidente Nereu Ramos, a chefia do Senado, além da maioria dos governos estaduais. Essa soma de cargos explica a liderança folgada no índice. A UDN era a principal oposição; o PTB cresceu com a volta de Vargas em 1950.","gov":"Dutra (PSD) governou de 1946 a 1951 com o PSD à frente; a UDN fez oposição, mas aderiu ao acordo interpartidário de 1948 com PSD e PR. Vargas venceu em 1950 pelo PTB e governou com apoio de PSD e PSP até o suicídio, em agosto de 1954; assumiu o vice, Café Filho (PSP).","ev":"1947: o Partido Comunista (PCB) é posto na ilegalidade e perde os mandatos. 1953: criação da Petrobras após a campanha “O petróleo é nosso”. 1954: a crise política em torno de Vargas termina com sua morte.","id":"Anticomunismo do início da Guerra Fria contra o populismo nacionalista e trabalhista. As mulheres votavam desde 1932, mas poucas ocupavam cargos. A esquerda foi empurrada para as margens pela proibição de 1947.","extra":"PCB (proibido desde 1947)","a":1947,"b":1954,"ic":0},{"t":"Desenvolvimentismo e crise","lead":"Crescimento, Brasília e a deriva até o golpe de 1964.","power":"O PSD ainda liderava, mas o PTB subiu: João Goulart (PTB), como vice-presidente, presidiu o Senado a partir de 1956. Ranieri Mazzilli (PSD) presidiu a Câmara de 1958 a 1965 e assumiu a Presidência da República duas vezes por poucos dias, exemplo de como a presidência de uma casa pode pesar.","gov":"Kubitschek (PSD, com Goulart, do PTB, como vice) governou de 1956 a 1961. Jânio Quadros renunciou em agosto de 1961; os militares resistiram à posse de Goulart e o Congresso adotou o parlamentarismo até o plebiscito de 1963, que restaurou o presidencialismo.","ev":"1960: inauguração de Brasília. 1961: renúncia de Jânio. 1962–63: mobilização por reforma agrária e sindical. 31 de março de 1964: golpe militar derruba Goulart.","id":"Otimismo desenvolvimentista e depois polarização: uma esquerda mobilizada (sindicatos, ligas camponesas, em parte inspirada pela Revolução Cubana) contra uma reação conservadora de empresários, Igreja e setores militares.","extra":"PSP, PDC, PRP (partidos pequenos)","a":1955,"b":1964,"ic":1},{"t":"A ditadura bipartidária","lead":"Os partidos foram extintos em 1965; só ARENA e MDB eram permitidos.","power":"A ARENA tinha a Presidência, as duas presidências de casa e, até 1982, todos os governos estaduais exceto o da Guanabara (Chagas Freitas, do MDB, 1971–75), o que lhe dá cerca de 77–85% do total no índice. O peso do MDB vinha dos deputados e, depois de 1974, dos senadores, mas não se traduzia em cargos.","gov":"Castelo Branco (1964–67), Costa e Silva (1967–69, depois uma junta), Médici, Geisel e Figueiredo, todos generais do Exército escolhidos pelos militares e referendados em votação indireta no Congresso. Os governadores também eram indiretos.","ev":"1965: o Ato Institucional 2 extingue os partidos. 1968: o AI-5 fecha o Congresso e cassa direitos. 1968–73: o “milagre econômico”. 1974: avanço do MDB no Senado. 1979: Lei da Anistia e reforma partidária.","id":"Doutrina de segurança nacional e anticomunismo no poder; esquerda armada e estudantil reprimida; a teologia da libertação da Igreja e um novo movimento feminista (Ano Internacional da Mulher, 1975) crescem no espaço da oposição.","extra":"PCB e PCdoB (clandestinos); nenhum terceiro partido legal","a":1965,"b":1979,"ic":2},{"t":"Abertura e redemocratização","lead":"A volta das eleições, um novo sistema partidário e uma nova Constituição.","power":"O PDS, herdeiro da ARENA, liderou até 1985. Depois o PMDB assumiu a Presidência (Sarney), a Câmara (Ulysses Guimarães), o Senado e 22 dos 23 governos estaduais escolhidos em 1986. É a maior concentração de poder dos dados depois da ditadura.","gov":"1982: voltam as eleições diretas para governador. 1984: a campanha “Diretas Já” é derrotada no Congresso. Jan. 1985: Tancredo Neves é eleito por colégio eleitoral, mas adoece; Sarney assume em 15 de março e continua após a morte de Tancredo, em 21 de abril. 1989: primeira eleição presidencial direta desde 1960.","ev":"1980: fundação do PT. 1986: Plano Cruzado. 1987–88: Assembleia Constituinte e a Constituição de 1988. Inflação alta em todo o período.","id":"Mobilização democrática de massas, novo sindicalismo e nascimento do PT; os movimentos de mulheres e negro entram na Constituinte; o sistema partidário se divide em PMDB, PFL, PDT, PT e outros.","extra":"PCB e PCdoB (legais desde 1985), PSB, PV e muitos pequenos partidos novos","a":1980,"b":1989,"ic":3},{"t":"Mercado, estabilidade e o PSDB","lead":"A hiperinflação acaba e uma aliança PSDB–PFL governa.","power":"O PMDB perdeu força depois de 1990. O PSDB assumiu a Presidência em 1995 com Fernando Henrique Cardoso e governou com o PFL, que presidiu a Câmara (1993–97) e o Senado (1997–2001) em momentos distintos: um aliado pode ter mais cargos que o partido do presidente.","gov":"Collor (PRN) governou a partir de 1990 e renunciou em dezembro de 1992, em meio ao processo de impeachment; Itamar Franco (sem partido durante o mandato; voltou ao PMDB em 1997) governou de 1992 a 1994; Cardoso (PSDB) governou de 1995 a 2003, com a emenda da reeleição de 1997.","ev":"1990: o Plano Collor congela as poupanças. 1992: impeachment. 1994: o Plano Real encerra a hiperinflação. 1997–98: grandes privatizações (Vale, telecomunicações).","id":"Correntes neoliberais e de “terceira via”; privatização e disciplina fiscal; o PT cresce como principal oposição; as igrejas evangélicas começam a se organizar politicamente.","extra":"PRN, PDC, PTR, PRONA e outros com poucas cadeiras","a":1990,"b":2002,"ic":4},{"t":"A era do PT","lead":"Lula e Dilma, com o PMDB como parceiro indispensável.","power":"O PT teve a Presidência todo o período e a Presidência da Câmara em alguns momentos (João Paulo 2003–05, Chinaglia 2007–09, Marco Maia 2011–13). O MDB presidiu o Senado quase sempre e a Câmara em 2009–11 e 2013–16, de modo que os dois partidos são os polos do índice.","gov":"Lula (2003–10) montou amplas coalizões em torno de PT, PMDB, PP, PR e PSB; Dilma Rousseff (2011–16) perdeu coesão depois dos protestos de 2013 e da reeleição apertada em 2014.","ev":"2003: Bolsa Família. 2005: escândalo do “mensalão”. 2008: crise global. 2013: protestos de junho. 2014: começa a Operação Lava Jato.","id":"A “onda vermelha” latino-americana (maré rosa): programas sociais, aumento do salário mínimo e redução da pobreza. A Lei Maria da Penha (2006) marca um avanço feminista; uma quarta onda feminista e uma reação conservadora crescem juntas.","extra":"PSOL (desde 2005), PV, PCdoB e PPS em blocos pequenos","a":2003,"b":2015,"ic":5},{"t":"Impeachment, antipolítica e fragmentação","lead":"Uma presidente afastada, uma nova direita e um Congresso disperso.","power":"Em 2016 o MDB disparou: Michel Temer tinha a Presidência, e o MDB também o Senado e, até julho, a Câmara. Depois de 2018 o índice se espalha: PSL e depois PL na Presidência, enquanto DEM, PP e PSD presidiam as casas.","gov":"Dilma sofreu impeachment em agosto de 2016; Temer (MDB) governou até 2018; Jair Bolsonaro (PSL, depois sem partido e então PL) venceu em 2018; Lula ganhou o segundo turno de 2022 por margem estreita.","ev":"2016: impeachment. 2017–18: Lula condenado e impedido de concorrer; as condenações foram anuladas pelo STF em 2021. 2018: protestos de mulheres “Ele Não”. 2020: pandemia de Covid-19. 2021: o centrão da Câmara ganha controle do orçamento.","id":"Uma onda populista de direita e anticorrupção e um forte conservadorismo evangélico. O centrão é um bloco informal de partidos médios, em geral de centro-direita (PP, PL, Republicanos, União e outros), que trocam apoio legislativo por cargos e acesso ao orçamento. Movimentos feministas e negros se mobilizam contra; o PT se enfraquece e depois se recupera.","extra":"Novo, Rede, Solidariedade, Podemos e uma dúzia de outros com poucas cadeiras","a":2016,"b":2022,"ic":6},{"t":"Lula de novo, poder dividido","lead":"Um presidente de esquerda, com o centro e a direita no comando das duas casas.","power":"O PT recuperou a Presidência, mas não as casas: PP (Arthur Lira) e depois Republicanos (Hugo Motta) na Câmara, PSD (Pacheco) e depois União (Alcolumbre) no Senado. O índice distribui o poder entre PT, União, Republicanos, PL e PSD.","gov":"O terceiro mandato de Lula começou em 1º de janeiro de 2023, com ampla coalizão incluindo MDB, PSD, União e PSB. As federações partidárias (PT–PCdoB–PV, PSOL–Rede, PSDB–Cidadania) começaram em 2022.","ev":"8 de janeiro de 2023: ataques à Praça dos Três Poderes. 2023: novo arcabouço fiscal e reforma tributária. 2026: eleições gerais em andamento no momento desta redação.","id":"Polarização aberta entre a esquerda e a direita bolsonarista, com um centrão pragmático no meio; política identitária, gênero e religião seguem centrais nas campanhas.","extra":"PSTU, PCO, UP e o atual PCB (registrados, sem cadeiras federais); Novo, Rede, PMB, DC e Agir com poucas","a":2023,"b":2026,"ic":7}],"M":[["O que mede","O Índice de Poder Partidário (PPI) pontua cada linha partidária em cada ano pelos cargos que ocupa: presidente, presidente da Câmara, presidente do Senado, parcela dos governos estaduais, parcela das cadeiras do Senado e parcela das cadeiras da Câmara. Cobre poder executivo e legislativo, não só o Congresso. Os valores são pontos do modelo em torno de 100, não parcela de influência real."],["A fórmula","Índice = 15 × presidente (0 ou 1) + 8 × presidente da Câmara + 7 × presidente do Senado + 20 × parcela dos governos estaduais + 14 × parcela das cadeiras do Senado + 36 × parcela das cadeiras da Câmara. Os pesos somam 100. A incerteza de uma coalizão deve ser calculada em conjunto, então somar medianas é só uma aproximação."],["Retrato e datas","Cada ano é um retrato de 1º de julho: titulares e cadeiras nessa data. Mudanças dentro do ano não aparecem, por exemplo em 1954, 1961, 1985, 1992, 2005 e 2016. Em 1º de julho de 2005 a Câmara era de Severino Cavalcanti (PP); Aldo Rebelo (PCdoB) assumiu em setembro. 2026 é o ano até agora."],["Por que esses pesos","São um julgamento, não um resultado. Os dados de votações nominais mostram que o partido do presidente entrega de um quinto a um quarto dos votos do governo, por isso a Presidência não pesa muito mais que as cadeiras. Outros pesos seriam plausíveis; a incerteza abaixo mostra quanto isso importa."],["A incerteza, em detalhe","5.000 sorteios com semente 11. Cada peso é multiplicado por um fator lognormal (sigma 0,5) e reescalado para 100. As cadeiras recebem ruído normal independente: Câmara dp 3 de 513; governos dp 1,5 de 27 e senadores dp 3 de 81 onde há dados eleitorais, dp 3 e 6 onde são estimados. As faixas são medianas e por isso podem somar mais ou menos que 100."],["Cadeiras, fontes e partidos","As cadeiras da Câmara são parcelas: a partir de 2001, a média de deputados de cada partido que votaram nas votações nominais do ano (acompanha trocas de partido); antes, as listas partidárias da legislatura (incluem suplentes). Desde 1995 os governadores vêm do TSE, conferidos com a Wikipédia (96% de acordo), e os senadores dos registros de filiação do Senado, conferidos com o TSE. Em 1947–1994 os governadores vêm de tabelas eleitorais estaduais (faltam as eleições de 1955, 1960 e 1965; 1966–82 é fixado no partido do governo) e os senadores são estimados pelas parcelas da Câmara (faixas mais claras). Um partido só pontua nos anos em que existiu legalmente. Partidos abaixo de 1 ponto ficam de lado."],["Como o poder funciona no Congresso","O índice usa só cargos formais. A influência real passa também por presidências de comissões, controle da pauta pelo presidente da Câmara, líderes partidários, emendas orçamentárias e quóruns: 257 de 513 deputados para maioria, e 308 deputados mais 49 senadores para emenda constitucional."],["Exemplo calculado","__EX__"]],"V":[{"s":"República Populista","t":"A República Populista","lead":"Política multipartidária e competitiva sob a Constituição de 1946, de Dutra a Goulart, encerrada pelo golpe de 1964.","power":"O PSD teve a Presidência com Dutra (1946–51) e Kubitschek (1956–61), além da maioria dos governos estaduais e da chefia do Senado pelos vice-presidentes. O PTB cresceu com Vargas e Goulart, cuja vice-presidência (1956–61) deu ao partido a presidência do Senado. A UDN, principal oposição, perdeu todas as eleições presidenciais até Jânio Quadros, em 1960. Ranieri Mazzilli (PSD) presidiu a Câmara a partir de 1958 e assumiu duas vezes a Presidência por poucos dias.","gov":"Dutra (PSD), Vargas (PTB, 1951–54), Café Filho (PSP), um breve interinato de Luz e Nereu Ramos, Kubitschek (PSD), Jânio Quadros (1961) e Goulart (PTB) sob o parlamentarismo de 1961 até o plebiscito de 1963, que restaurou o presidencialismo.","ev":"1947: o PCB é proibido. 1950: Vargas vence. 1953: Petrobras. 1954: suicídio de Vargas. 1955: o Exército garante a posse de Kubitschek. 1960: inauguração de Brasília. 1961: renúncia de Jânio. 1963: o plebiscito restaura o presidencialismo.","id":"Trabalhismo nacionalista e desenvolvimentismo contra o anticomunismo liberal, à sombra da Guerra Fria e da Revolução Cubana; ligas camponesas e sindicatos se mobilizam enquanto empresários, Igreja e militares organizam a reação conservadora.","extra":"PCB (proibido), PSP, PDC, PRP, PTN e outros partidos pequenos","a":1947,"b":1963,"ic":0},{"s":"Regime Militar","t":"O Regime Militar","lead":"Dois partidos permitidos, generais na Presidência e nenhuma alternância real no poder.","power":"A partir de 1966 só ARENA e MDB eram permitidos. A ARENA, e depois sua herdeira, o PDS, teve a Presidência, as duas presidências de casa e todos os governos estaduais exceto o da Guanabara (MDB, 1971–75), o que lhe dá cerca de 77–85% do total no índice. O peso do MDB vinha dos deputados e, depois de 1974, dos senadores, nunca de cargos.","gov":"Castelo Branco (1964–67), Costa e Silva (1967–69), uma junta, Médici, Geisel e Figueiredo, todos generais do Exército escolhidos pelos militares e referendados indiretamente pelo Congresso. Os governadores eram indiretos até a volta das eleições diretas em 1982.","ev":"1964: golpe. 1965: o AI-2 extingue os partidos. 1968: o AI-5 fecha o Congresso. 1974: o MDB avança no Senado. 1977: o Pacote de Abril fecha o Congresso e cria senadores escolhidos indiretamente. 1979: anistia e reforma partidária. 1980: fundação do PT. 1983–84: campanha das Diretas Já.","id":"Doutrina de segurança nacional e anticomunismo no poder; esquerda armada e estudantil reprimida; o “milagre econômico” de 1968–73; depois a teologia da libertação da Igreja, o novo sindicalismo e um novo movimento feminista abrem espaço para a oposição.","extra":"PCB e PCdoB (clandestinos); nenhum terceiro partido legal até 1980","a":1964,"b":1984,"ic":2},{"s":"Redemocratização","t":"Redemocratização e Estabilização","lead":"Da transição de Sarney ao segundo mandato de Cardoso: nova Constituição, hiperinflação e o Plano Real.","power":"Em 1985 o PMDB assumiu a Presidência (Sarney), a Câmara (Ulysses Guimarães), o Senado e 22 dos 23 governos estaduais escolhidos em 1986, a maior concentração de poder nos dados depois da ditadura. Perdeu força após 1990. O PSDB teve a Presidência a partir de 1995 e governou com o PFL, que presidiu a Câmara (1993–97) e o Senado (1997–2001).","gov":"Sarney (1985–90, após a morte de Tancredo Neves antes da posse), Collor (PRN, 1990–92, renunciou em meio ao impeachment), Itamar Franco (sem partido, 1992–94) e Cardoso (PSDB, 1995–2002), cuja emenda de 1997 permitiu a reeleição.","ev":"1986: Plano Cruzado. 1988: a Constituição. 1989: primeira eleição presidencial direta desde 1960. 1990: Plano Collor. 1992: renúncia de Collor. 1994: Plano Real. 1997–98: privatizações.","id":"Mobilização democrática e os direitos sociais da Constituição de 1988, depois uma virada neoliberal e de “terceira via”: privatização e disciplina fiscal. O PT cresce como principal oposição e as igrejas evangélicas começam a se organizar politicamente.","extra":"PRN, PDC, PTR, PRONA e outros com poucas cadeiras","a":1985,"b":2002,"ic":3},{"s":"Polarização","t":"Presidencialismo de Coalizão e Polarização","lead":"Do primeiro mandato de Lula até hoje: o PT, um impeachment, uma nova direita e um Congresso fragmentado.","power":"O PT teve a Presidência de 2003 a 2016 e a Câmara em alguns momentos; o MDB presidiu o Senado quase sempre, e os dois partidos foram os polos do índice. Em 2016 o MDB disparou com Temer. Depois de 2018 o poder se espalhou: PSL e PL na Presidência; DEM, PP, PSD, União e Republicanos nas casas.","gov":"Lula (2003–10), Dilma Rousseff (2011–16, afastada), Michel Temer (2016–18), Jair Bolsonaro (2019–22) e Lula de novo desde 2023, todos governando por coalizões amplas e instáveis.","ev":"2003: Bolsa Família. 2005: escândalo do “mensalão”. 2013: protestos de junho. 2014: Operação Lava Jato. 2016: impeachment. 2018: Bolsonaro vence. 2020: Covid-19. 2022: Lula vence o segundo turno. 2023: ataques de 8 de janeiro.","id":"A “maré rosa” latino-americana e os programas sociais, um avanço feminista (Lei Maria da Penha, 2006, e os protestos “Ele Não”, 2018), forte conservadorismo evangélico e uma onda populista de direita e anticorrupção. O centrão, bloco informal de partidos médios, em geral de centro-direita, troca apoio legislativo por cargos e acesso ao orçamento.","extra":"PSOL, Rede, Novo, Solidariedade, Podemos e outros com poucas cadeiras; PSTU, PCO, UP e PCB (registrados, sem cadeiras federais)","a":2003,"b":2026,"ic":6}]}};
